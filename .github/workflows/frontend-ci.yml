name: Frontend CI

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/publish-pages.yml"
      - ".github/workflows/pages-smoke.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/publish-pages.yml"
      - ".github/workflows/pages-smoke.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/api-client.js
          node --check web/inbox-ui.js
          node --check web/service-worker.js
      - name: Check required PWA files
        run: test -f web/index.html && test -f web/styles.css && test -f web/inbox.css && test -f web/manifest.webmanifest && test -f web/service-worker.js && test -f web/icon.svg && test -f web/api-client.js && test -f web/inbox-ui.js
      - name: Validate manifest JSON
        run: python -m json.tool web/manifest.webmanifest >/dev/null
      - name: Check HTML references
        run: grep -q './styles.css' web/index.html && grep -q './app.js' web/index.html && grep -q './manifest.webmanifest' web/index.html
      - name: Check API sync hooks
        run: grep -q "import('./api-client.js')" web/app.js && grep -q "bar-manager-api-configured" web/app.js && grep -q "barManagerPendingOperations" web/app.js
      - name: Check live inbox hooks
        run: |
          grep -q "listInbox" web/api-client.js
          grep -q "createTaskFromInbox" web/api-client.js
          grep -q "listTelegramChats" web/api-client.js
          grep -q "import('./inbox-ui.js')" web/api-client.js
          grep -q "data-create-inbox-task" web/inbox-ui.js
          grep -q "data-chat-allowed" web/inbox-ui.js
