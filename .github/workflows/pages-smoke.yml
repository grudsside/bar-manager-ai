name: Verify Published PWA

on:
  workflow_run:
    workflows: ["Publish PWA to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages propagation
        run: sleep 15
      - name: Verify published files
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://grudsside.github.io/bar-manager-ai"
          for path in "/" "/manifest.webmanifest" "/service-worker.js" "/release.json"; do
            echo "Checking ${BASE}${path}"
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location --max-time 20 "${BASE}${path}" > /dev/null; then
                echo "OK ${path}"
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "Failed ${path} after ${attempt} attempts"
                exit 1
              fi
              sleep 10
            done
          done
